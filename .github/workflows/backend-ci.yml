name: Backend CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'data/**'
      - 'render.yaml'
      - '.github/workflows/backend-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'data/**'
      - 'render.yaml'
      - '.github/workflows/backend-ci.yml'

jobs:
  backend-checks:
    name: Backend Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python syntax and bytecode compilation
        run: python -m compileall app

      - name: Validate FastAPI application initialization
        run: python -c "import app.main; print('FastAPI application initialized successfully')"
        env:
          DATABASE_URL: sqlite:///./ci_test.db
          SECRET_KEY: ci-temporary-secret-key-for-validation-only-not-for-prod
