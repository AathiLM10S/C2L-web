databases:
  - name: c2l-qc-database
    databaseName: c2l_qc
    user: c2l_user
    plan: free
    region: oregon

services:
  # FastAPI Backend Web Service
  - type: web
    name: c2l-qc-backend
    runtime: python
    rootDir: backend
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: c2l-qc-database
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"

  # Next.js Frontend Web Service
  - type: web
    name: c2l-qc-frontend
    runtime: node
    rootDir: frontend
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start -- -p $PORT
    envVars:
      - key: NODE_VERSION
        value: 20.10.0
      - key: NEXT_PUBLIC_API_URL
        value: https://c2l-qc-backend.onrender.com/api

